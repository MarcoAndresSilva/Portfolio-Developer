name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llegan varios pushes seguidos a la misma rama, cancela los runs viejos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npm run lighthouse

      # Guarda los reportes HTML de Lighthouse como descargable del run, incluso
      # si el paso de arriba falla (así se puede ver qué anduvo mal).
      - name: Subir reporte de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14
