# Blueprint de Render para apps/api — https://render.com/docs/blueprint-spec
#
# En render.com: New → Blueprint → conectar este repo. Render lee este archivo
# solo y crea el servicio con estos comandos (nada de completar formularios a mano).
#
# Ojo: NO se fija un "root directory" en apps/api. Esto es un monorepo con npm
# workspaces — el `npm ci` tiene que correr en la raíz del repo para que resuelva
# bien `@portfolio/shared` (si corriera solo dentro de apps/api, no lo encontraría).
services:
  - type: web
    name: portfoliodev-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace apps/api
    startCommand: node apps/api/dist/main.js
    envVars:
      # Dominio del sitio publicado (Netlify o el que sea) — sin esto, el CORS
      # bloquea las peticiones del formulario de contacto.
      - key: CORS_ORIGIN
        sync: false
      # API key de Resend para el envío de email real (ver ContactService). Se
      # usa la API HTTP y no SMTP porque el plan free de Render bloquea los
      # puertos SMTP salientes. Sin esta key el endpoint sigue funcionando pero
      # solo registra el mensaje en el log.
      - key: RESEND_API_KEY
        sync: false
      # Opcional: a dónde llegan los mensajes. Por defecto, el gmail de Marco
      # (ver ContactService). Ojo: sin dominio verificado en Resend, el destino
      # solo puede ser la casilla con la que se creó la cuenta.
      - key: CONTACT_TO
        sync: false
      # Opcional: remitente. Default `onboarding@resend.dev` (único válido sin
      # dominio propio verificado en Resend).
      - key: CONTACT_FROM
        sync: false
