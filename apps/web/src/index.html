<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Marco Andrés Silva — Desarrollador Full Stack</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Portafolio de Marco Andrés Silva, desarrollador Full Stack especializado en Angular y NestJS.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Anti-flash: aplica el tema guardado antes del primer pintado. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
