<section class="hero" aria-labelledby="hero-title">
  <div class="container hero__inner">
    <p class="hero__eyebrow" i18n="@@hero.eyebrow">Desarrollador Full Stack</p>
    <h1 id="hero-title" class="hero__title" i18n="@@hero.title">
      Hola, soy <span class="hero__name">Marco Silva</span>.
    </h1>
    <p class="hero__lead" i18n="@@hero.lead">
      Construyo aplicaciones web con Angular y NestJS. Este portafolio está en
      construcción — pronto vas a ver acá mis proyectos.
    </p>

    <div class="hero__actions">
      <a class="btn btn--primary" href="#proyectos" i18n="@@hero.cta.projects">Ver proyectos</a>
      <a class="btn btn--ghost" href="#contacto" i18n="@@hero.cta.contact">Contacto</a>
    </div>
  </div>
</section>
