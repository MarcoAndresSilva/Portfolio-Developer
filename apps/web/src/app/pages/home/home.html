<section class="hero" aria-labelledby="hero-title">
  <div class="container hero__inner">
    <p class="hero__eyebrow" i18n="@@hero.eyebrow">Ingeniero en Informática — Fullstack</p>
    <h1
      id="hero-title"
      class="hero__title"
      i18n="@@hero.title"
      appTypewriter
      [appTypewriterDelay]="700"
    >
      Hola, soy <span class="hero__name">Marco Silva.</span>
    </h1>
    <p class="hero__lead" i18n="@@hero.lead">
      Construyo ecosistemas web escalables con Angular y NestJS. Hoy en Fintech:
      OpenBanking bajo la Ley Fintech chilena, flujos OAuth2 y APIs
      transaccionales seguras.
    </p>

      <a class="btn btn--primary" href="#proyectos" i18n="@@hero.cta.projects">Ver proyectos</a>
      <a class="btn btn--ghost" href="#contacto" i18n="@@hero.cta.contact">Contacto</a>
