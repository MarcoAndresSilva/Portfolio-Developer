<header class="site-header">
  <div class="site-header__inner container">
    <a class="brand" routerLink="/" aria-label="Inicio">
      <span class="brand__mark">MS</span>
      <span class="brand__name">Marco Silva</span>
    </a>

    <nav class="nav" aria-label="Secciones">
      <ul class="nav__list" role="list">
        @for (item of nav; track item.fragment) {
          <li>
            <a class="nav__link" [href]="'#' + item.fragment">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="
        theme.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'
      "
    >
      @if (theme.theme() === 'dark') {
        <!-- sol -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor" />
          <path
            d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <!-- luna -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path
            d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"
            fill="currentColor"
          />
        </svg>
      }
    </button>
  </div>
</header>
