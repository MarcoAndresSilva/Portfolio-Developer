# Config de Netlify para el sitio (apps/web) — https://docs.netlify.com/configure-builds/file-based-configuration/
#
# En netlify.com: Add new site → importar este repo. Netlify lee este archivo
# solo (no hace falta tocar nada en la UI de "Build settings").
#
# `base` apunta a apps/web porque ahí vive angular.json: el plugin
# @netlify/angular-runtime busca ese archivo en el directorio de trabajo del
# build (cwd) y, al no encontrarlo en la raíz del monorepo, el build fallaba
# con "Could not locate your angular.json...". Con `base` seteado, Netlify
# instala dependencias en la raíz del repo (detecta los npm workspaces) pero
# corre el comando de build y resuelve `publish` desde apps/web — por eso
# `publish` sigue siendo "dist/web/browser" (coincide con el outputPath por
# defecto de Angular, relativo a apps/web) y no lleva el prefijo `apps/web/`.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist/web/browser"

[build.environment]
  NODE_VERSION = "22.23.1"
  # El dominio final del sitio (lo asigna Netlify, o el propio si se configura).
  # Tiene que coincidir con `siteUrl` de apps/web/src/environments/environment.ts
  # para que sitemap.xml / robots.txt / llms.txt usen el dominio correcto
  # (ver apps/web/scripts/seo-files.mjs).
  SITE_URL = "https://marco-silva.dev"
