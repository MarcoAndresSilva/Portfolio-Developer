# Config de Netlify para el sitio (apps/web) — https://docs.netlify.com/configure-builds/file-based-configuration/
#
# En netlify.com: Add new site → importar este repo. Netlify lee este archivo
# solo (no hace falta tocar nada en la UI de "Build settings").
#
# `npm install` corre en la raíz del repo (monorepo con npm workspaces) y el build
# apunta al workspace correcto. El plugin @netlify/angular-runtime detecta el
# monorepo (`packagePath: apps/web`) y ya resuelve `publish` relativo a ese paquete
# — por eso NO lleva el prefijo `apps/web/` (si se lo agregás, el path queda duplicado
# y el build falla con "Publish directory is configured incorrectly").
[build]
  command = "npm run build --workspace apps/web"
  publish = "dist/web/browser"

[build.environment]
  NODE_VERSION = "22.23.1"
  # El dominio final del sitio (lo asigna Netlify, o el propio si se configura).
  # Tiene que coincidir con `siteUrl` de apps/web/src/environments/environment.ts
  # para que sitemap.xml / robots.txt / llms.txt usen el dominio correcto
  # (ver apps/web/scripts/seo-files.mjs).
  SITE_URL = "https://marco-silva.dev"
